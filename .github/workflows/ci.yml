name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # No lockfile in the repo, so npm ci is not possible.
        # The Electron binary is not needed for a syntax check.
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Syntax check
        run: |
          node --check app.js
          node --check window.js

  dependabot-merge:
    # Merge Dependabot PRs once the checks above pass. GITHUB_TOKEN is enough
    # for dependency bumps; PRs that edit .github/workflows (Actions bumps) need
    # DEPENDABOT_MERGE_TOKEN, a PAT with the Workflows permission stored as a
    # Dependabot secret (Dependabot runs cannot read ordinary Actions secrets).
    needs: [check]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash
